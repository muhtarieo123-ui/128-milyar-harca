<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>128 Milyarı Harca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_BUDGET = 128000000000;

        const ITEMS = [
            { id: 'simit', name: 'Simit', price: 1, img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=60' },
            { id: 'cay', name: 'Çay', price: 1, img: 'https://images.unsplash.com/photo-1576092768241-dee231879e63?auto=format&fit=crop&w=500&q=60' },
            { id: 'netflix', name: 'Netflix Aboneliği (1 Yıl)', price: 120, img: 'https://images.unsplash.com/photo-1522869635100-9f4c3e86aa37?auto=format&fit=crop&w=500&q=60' },
            { id: 'ayakkabi', name: 'Lüks Spor Ayakkabı', price: 250, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=60' },
            { id: 'telefon', name: 'Son Model Akıllı Telefon', price: 1500, img: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=60' },
            { id: 'rolex', name: 'Rolex Saat', price: 15000, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=60' },
            { id: 'motorsiklet', name: 'Motosiklet', price: 240000, img: 'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=500&q=60' },
            { id: 'togg', name: 'TOGG', price: 600000, img: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=500&q=60' },
            { id: 'rezidans', name: 'Boğaz Manzaralı Rezidans', price: 2500000, img: 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=500&q=60' },
            { id: 'helikopter', name: 'Özel Helikopter', price: 50000000, img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=500&q=60' },
            { id: 'jet', name: 'Özel Jet', price: 650000000, img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=500&q=60' },
            { id: 'futbol', name: 'Büyük Futbol Kulübü', price: 2000000000, img: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=500&q=60' },
            { id: 'tupraş', name: 'Tüpraş', price: 75000000000, img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=60' }
        ];

        function App() {
            const [cart, setCart] = useState({});
            const [showReceipt, setShowReceipt] = useState(false);
            const [displayValue, setDisplayValue] = useState(INITIAL_BUDGET);
            
            // Yeni özellik state'leri
            const [receiptName, setReceiptName] = useState('');
            const [savedReceipts, setSavedReceipts] = useState(() => {
                const local = localStorage.getItem('saved_receipts_128');
                return local ? JSON.parse(local) : [
                    { id: '1', name: 'Vatandaşın Hayali', date: '04.09.2026', total: 125000, items: { simit: 1000, ayakkabi: 400 } },
                    { id: '2', name: 'Tasarruf Paketi', date: '04.09.2026', total: 1500, items: { telefon: 1 } }
                ];
            });
            const [showPublicArea, setShowPublicArea] = useState(false);
            const [selectedPublicReceipt, setSelectedPublicReceipt] = useState(null);

            const totalSpent = useMemo(() => {
                return Object.entries(cart).reduce((total, [itemId, quantity]) => {
                    const item = ITEMS.find(i => i.id === itemId);
                    return total + (item ? item.price * quantity : 0);
                }, 0);
            }, [cart]);

            const currentBalance = INITIAL_BUDGET - totalSpent;

            useEffect(() => {
                let start = displayValue;
                let end = currentBalance;
                if (start === end) return;

                let startTime = performance.now();
                const duration = 500;

                const animate = (currentTime) => {
                    let progress = Math.min((currentTime - startTime) / duration, 1);
                    let current = Math.floor(start + (end - start) * progress);
                    setDisplayValue(current);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };

                requestAnimationFrame(animate);
            }, [currentBalance]);

            const totalItemsCount = Object.values(cart).reduce((a, b) => a + b, 0);

            const handleBuy = (item, amount = 1) => {
                if (currentBalance >= item.price * amount) {
                    setCart(prev => ({ ...prev, [item.id]: (prev[item.id] || 0) + amount }));
                }
            };

            const handleSell = (item, amount = 1) => {
                if (cart[item.id] && cart[item.id] >= amount) {
                    setCart(prev => {
                        const newCart = { ...prev, [item.id]: prev[item.id] - amount };
                        if (newCart[item.id] <= 0) delete newCart[item.id];
                        return newCart;
                    });
                }
            };

            const handleSaveReceipt = () => {
                if (Object.keys(cart).length === 0) return;
                const newEntry = {
                    id: Date.now().toString(),
                    name: receiptName.trim() || 'İsimsiz Vatandaş',
                    date: new Date().toLocaleDateString('tr-TR'),
                    total: totalSpent,
                    items: { ...cart }
                };
                const updated = [newEntry, ...savedReceipts];
                setSavedReceipts(updated);
                localStorage.setItem('saved_receipts_128', JSON.stringify(updated));
                setReceiptName('');
                setShowReceipt(false);
                setShowPublicArea(true);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center pb-24">
                    {/* Header */}
                    <header className="w-full bg-slate-800 border-b border-slate-700 py-6 px-4 text-center sticky top-0 z-40 shadow-md flex flex-col sm:flex-row justify-between items-center max-w-6xl">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-emerald-400 mb-1">128 MİLYARI HARCA</h1>
                            <p className="text-slate-400 text-xs md:text-sm">128 Milyar Doları bitirebilir misin?</p>
                        </div>
                        <button 
                            onClick={() => setShowPublicArea(true)}
                            className="mt-4 sm:mt-0 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-md flex items-center gap-2"
                        >
                            📋 Kaydedilen Fişleri Gör ({savedReceipts.length})
                        </button>
                    </header>

                    {/* Sticky Balance Bar */}
                    <div className="sticky top-[88px] z-30 w-full bg-emerald-600 text-white py-4 shadow-lg text-center font-bold text-2xl md:text-3xl tracking-wider">
                        Kalan Bütçe: ${displayValue.toLocaleString('tr-TR')}
                    </div>

                    {/* Items Grid */}
                    <main className="max-w-6xl w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6">
                        {ITEMS.map((item) => {
                            const quantity = cart[item.id] || 0;
                            const canAfford = currentBalance >= item.price;

                            return (
                                <div key={item.id} className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 flex flex-col shadow-md">
                                    <img src={item.img} alt={item.name} className="h-40 w-full object-cover" />
                                    <div className="p-4 flex flex-col flex-grow">
                                        <h2 className="font-bold text-lg">{item.name}</h2>
                                        <p className="text-emerald-400 font-semibold mb-4">${item.price.toLocaleString('tr-TR')}</p>
                                        
                                        <div className="mt-auto flex items-center justify-between gap-2">
                                            <button 
                                                onClick={() => handleSell(item, 1)}
                                                disabled={quantity === 0}
                                                className="bg-red-600 hover:bg-red-700 disabled:bg-slate-700 text-white font-bold px-3 py-2 rounded-lg transition"
                                            >
                                                Sat
                                            </button>
                                            <span className="font-bold text-lg">{quantity}</span>
                                            <button 
                                                onClick={() => handleBuy(item, 1)}
                                                disabled={!canAfford}
                                                className="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-700 text-white font-bold px-3 py-2 rounded-lg transition"
                                            >
                                                Satın Al
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </main>

                    {/* Bottom Receipt Button */}
                    {totalItemsCount > 0 && (
                        <div className="fixed bottom-6 z-50">
                            <button 
                                onClick={() => setShowReceipt(true)}
                                className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold px-8 py-4 rounded-full shadow-2xl text-lg flex items-center gap-3 transition transform hover:scale-105"
                            >
                                Alışverişi Tamamla / Fişi Gör
                            </button>
                        </div>
                    )}

                    {/* Receipt Modal */}
                    {showReceipt && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div className="bg-white text-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <h2 className="text-2xl font-black text-center mb-1">T.C. KASASI FİŞİ</h2>
                                <p className="text-center text-xs text-slate-500 mb-4">Alışveriş Dökümü</p>

                                <div className="mb-4">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Fişinize İsim Verin:</label>
                                    <input 
                                        type="text" 
                                        placeholder="Örn: Ahmet'in Sepeti" 
                                        value={receiptName}
                                        onChange={(e) => setReceiptName(e.target.value)}
                                        className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500"
                                    />
                                </div>

                                <div className="divide-y divide-slate-200 mb-6 max-h-48 overflow-y-auto pr-1">
                                    {Object.entries(cart).map(([id, qty]) => {
                                        const item = ITEMS.find(i => i.id === id);
                                        return (
                                            <div key={id} className="py-2 flex justify-between text-sm">
                                                <span>{item.name} x {qty}</span>
                                                <span className="font-bold">${(item.price * qty).toLocaleString('tr-TR')}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="border-t-2 border-dashed border-slate-300 pt-4 mb-6 flex justify-between font-black text-lg">
                                    <span>Toplam Harcanan:</span>
                                    <span className="text-emerald-600">${totalSpent.toLocaleString('tr-TR')}</span>
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={handleSaveReceipt}
                                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-md"
                                    >
                                        Alışverişi Kaydet
                                    </button>
                                    <button 
                                        onClick={() => setShowReceipt(false)}
                                        className="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm"
                                    >
                                        Kapat
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Public Saved Receipts Area Modal */}
                    {showPublicArea && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 text-slate-100 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                                    <h2 className="text-xl font-bold text-emerald-400">Oyuncuların Kaydettiği Fişler</h2>
                                    <button onClick={() => setShowPublicArea(false)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                                </div>

                                <div className="space-y-3 overflow-y-auto flex-grow pr-1">
                                    {savedReceipts.map((rec) => (
                                        <div key={rec.id} className="bg-slate-700/50 border border-slate-600 p-4 rounded-xl flex justify-between items-center">
                                            <div>
                                                <h3 className="font-bold text-base text-white">{rec.name}</h3>
                                                <p className="text-xs text-slate-400">Tarih: {rec.date} | Harcama: <span className="text-emerald-400 font-semibold">${rec.total.toLocaleString('tr-TR')}</span></p>
                                            </div>
                                            <button 
                                                onClick={() => setSelectedPublicReceipt(rec)}
                                                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition"
                                            >
                                                Fişi İncele
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={() => setShowPublicArea(false)}
                                    className="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition"
                                >
                                    Kapat
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Single Public Receipt Detail Modal */}
                    {selectedPublicReceipt && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-white text-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[80vh] overflow-y-auto">
                                <h2 className="text-xl font-black text-center mb-1">{selectedPublicReceipt.name}</h2>
                                <p className="text-center text-xs text-slate-500 mb-6">Tarih: {selectedPublicReceipt.date}</p>

                                <div className="divide-y divide-slate-200 mb-6">
                                    {Object.entries(selectedPublicReceipt.items).map(([id, qty]) => {
                                        const item = ITEMS.find(i => i.id === id);
                                        if (!item) return null;
                                        return (
                                            <div key={id} className="py-2 flex justify-between text-sm">
                                                <span>{item.name} x {qty}</span>
                                                <span className="font-bold">${(item.price * qty).toLocaleString('tr-TR')}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="border-t-2 border-dashed border-slate-300 pt-4 mb-6 flex justify-between font-black text-lg">
                                    <span>Toplam:</span>
                                    <span className="text-emerald-600">${selectedPublicReceipt.total.toLocaleString('tr-TR')}</span>
                                </div>

                                <button 
                                    onClick={() => setSelectedPublicReceipt(null)}
                                    className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm"
                                >
                                    Geri Dön
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
